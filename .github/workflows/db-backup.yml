name: Backup do banco (produção)

# Faz um dump completo do PostgreSQL de produção e guarda como artifact.
# Objetivo: não perder dados quando o Postgres free do Render expirar —
# basta baixar o último artifact e restaurar no banco novo.
#
# Pré-requisito: criar o secret do repositório PROD_DATABASE_URL com a
# connection string (External Database URL) do Postgres no Render.
# (Settings → Secrets and variables → Actions → New repository secret)

on:
  schedule:
    - cron: "0 6 * * *" # todo dia às 06:00 UTC (~03:00 BRT)
  workflow_dispatch: {} # permite rodar manualmente pelo botão "Run workflow"

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar dump do banco (pg_dump v18 via container)
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$PROD_DATABASE_URL" ]; then
            echo "::error::Secret PROD_DATABASE_URL não configurado."
            exit 1
          fi
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          # Usa o client v18 para casar com o servidor (Postgres 18).
          # -Fc = formato custom (compactado, restaurável com pg_restore).
          docker run --rm -e PGURL="$PROD_DATABASE_URL" postgres:18-alpine \
            pg_dump --no-owner --no-privileges -Fc "$PROD_DATABASE_URL" \
            > "backup-${STAMP}.dump"
          ls -lh "backup-${STAMP}.dump"

      - name: Publicar backup como artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.STAMP }}
          path: backup-${{ env.STAMP }}.dump
          retention-days: 90 # cobre com folga o prazo de expiração do banco
          if-no-files-found: error
